[project]
name = "enterprise-rag"
version = "0.1.0"
description = "Production-grade Enterprise Agentic RAG"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    # Core & API
    "fastapi>=0.139.0",
    "langchain>=1.3.13",
    "uvicorn[standard]>=0.51.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    # Data ingestion & document parsing
    "docx2txt>=0.9",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.1.2",
    "pypdf>=6.14.2",
    "python-pptx>=1.0.2",
    "unstructured>=0.24.1",
    # LLM
    "langchain-groq>=1.1.3",
    # Retrieval
    "langchain-google-genai>=4.2.7",
    #Guard
    "nemoguardrails>=0.23.0",
    # Vector database
    "qdrant-client>=1.18.0",
    # UI
    "streamlit>=1.59.2",
    "requests>=2.34.2",
    # Observeability & Tracing
    "logfire[fastapi]>=4.37.0",
    "langfuse>=4.14.0",
    "flashrank>=0.2.10",
    "fastembed>=0.8.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.21",
    "basedpyright>=1.39.9",
    "pre-commit>=4.6.0",
]
eval = [
    "ragas==0.3.2",
]

[tool.basedpyright]
typeCheckingMode = "standard"

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["E402"]  # configure_logging() must run before importing modules that log on import
